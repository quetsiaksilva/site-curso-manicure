<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Curso New Life de manicure profissional.">

    <title>{% block title %}Curso New Life{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-md">
        <div class="container">

            <a href="{{ url_for('index') }}" class="logo navbar-brand">
                New<span>Life</span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <nav class="nav navbar-nav ms-auto" aria-label="Navegação principal">
                    <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    <a class="nav-link" href="{{ url_for('sobre') }}">Sobre</a>
                    <a class="nav-link" href="{{ url_for('contato') }}">Contato</a>
                </nav>
            </div>

        </div>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <div class="container footer-row">
        <strong>Curso New Life</strong>
        <small>
            Quétsia Keslen da Silva — Atividade 3 - Deploy de Servidor Web Flask
        </small>
    </div>
</footer>

<!-- JavaScript do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
